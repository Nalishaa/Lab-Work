<html>
<head>
  <title>Form Validation (jQuery)</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<form id="myForm">

  <label>Name: </label>
  <input type="text" id="name" />
  <br><br>

  <label>Gender: </label>
  <input type="radio" name="gender" value="M"> Male
  <input type="radio" name="gender" value="F"> Female
  <input type="radio" name="gender" value="O"> Other
  <br><br>

  <label>Hobbies: </label>
  <input type="checkbox" name="hobbies"> Football
  <input type="checkbox" name="hobbies"> Table Tennis
  <input type="checkbox" name="hobbies"> Basketball
  <br><br>

  <label>Appointment Date & Time: </label>
  <input type="datetime-local" id="appointment">
  <br><br>

  <label>Country: </label>
  <select id="country">
    <option value="">-- Select --</option>
    <option>Nepal</option>
    <option>India</option>
    <option>USA</option>
  </select>
  <br><br>

  <label>Email: </label>
  <input type="text" id="email">
  <br><br>

  <label>Phone: </label>
  <input type="text" id="phone">
  <br><br>

  <label>Resume (PDF / Image): </label>
  <input type="file" id="resume" accept=".pdf,.jpg,.jpeg,.png">
  <br><br>

  <label>Password: </label>
  <input type="password" id="password">
  <br><br>

  <label>Confirm Password: </label>
  <input type="password" id="confirmPassword">
  <br><br>

  <button type="submit">Submit</button>

</form>

<script>
$(document).ready(function(){

  $("#myForm").submit(function(e){
    e.preventDefault();

    // Get values
    let name = $("#name").val().trim();
    let gender = $("input[name='gender']:checked").val();
    let hobbies = $("input[name='hobbies']:checked").length;
    let appointment = $("#appointment").val();
    let country = $("#country").val();
    let email = $("#email").val().trim();
    let phone = $("#phone").val().trim();
    let password = $("#password").val();
    let confirmPassword = $("#confirmPassword").val();
    let resume = $("#resume")[0].files[0];

    // Regex
    let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let phoneRegex = /^(9\d{9}|01\d{7})$/;
    let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

    // Name validation
    if(name === ""){
      alert("Name is required");
      return;
    }

    // Gender
    if(!gender){
      alert("Please select gender");
      return;
    }

    // Hobbies
    if(hobbies === 0){
      alert("Select at least one hobby");
      return;
    }

    // Appointment date
    if(appointment === ""){
      alert("Select appointment date & time");
      return;
    }

    let selectedDate = new Date(appointment);
    let currentDate = new Date();

    if(selectedDate < currentDate){
      alert("Appointment date cannot be in past");
      return;
    }

    // Country
    if(country === ""){
      alert("Select country");
      return;
    }

    // Email
    if(!emailRegex.test(email)){
      alert("Enter valid email");
      return;
    }

    // Phone
    if(!phoneRegex.test(phone)){
      alert("Phone must be 9********* or 01*******");
      return;
    }

    // Resume
    if(!resume){
      alert("Upload resume");
      return;
    }

    let fileType = resume.type;
    let validTypes = ["application/pdf","image/jpeg","image/png"];

    if(!validTypes.includes(fileType)){
      alert("Resume must be PDF or Image");
      return;
    }

    if(resume.size > 2 * 1024 * 1024){
      alert("File size must be less than 2MB");
      return;
    }

    // Password
    if(!passwordRegex.test(password)){
      alert("Password must be 8+ chars with uppercase, lowercase, number & symbol");
      return;
    }

    // Confirm password
    if(password !== confirmPassword){
      alert("Passwords do not match");
      return;
    }

    alert("Form submitted successfully!");
    $("#myForm")[0].reset();

  });

});
</script>

</body>
</html>
