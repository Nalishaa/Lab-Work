<!-- What is AJAX
AJAX (Asynchronous JavaScript and XML) allows web pages to update asynchronously by exchanging data with the server behind the scenes without reloading the entire page.

Benefits of Using AJAX

Asynchronous Communication
Only specific parts of the page are updated.
Improves user experience in live search, chat apps, and auto-saving forms.

Reduced Server Load & Bandwidth Usage
Only the required data is sent and received.
No need to reload the full HTML page.

Better User Experience
Eliminates flickering or full page reloads.
Makes web applications feel like desktop applications.

Faster Page Interaction
Data is exchanged in small chunks in the background.
Users get faster responses.

Supports Multiple Data Formats
Works with JSON (most common), XML, HTML, or plain text. -->
<html>
  <head>
    <title>AJAX Example (jQuery)</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <script>
    function loadContent() {
      $.ajax({
        url: "https://jsonplaceholder.typicode.com/posts",
        method: "GET",
        success: function (data) {
          $("#content").empty(); // clear previous content

          data.forEach(function (post) {
            $("#content").append(
              `<p><strong>${post.id}:</strong> ${post.title}</p>`,
            );
          });
        },
        error: function (error) {
          console.error("Error fetching posts:", error);
          $("#content").text("Error fetching posts");
        },
      });
    }
  </script>

  <body>
    <h1>AJAX Demo (jQuery)</h1>
    <button onclick="loadContent()">Load Content</button>
    <div id="content"></div>
  </body>
</html>
